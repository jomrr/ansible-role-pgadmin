---
# role: pgadmin
# file: tasks/main.yml

- name: PGADMIN | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __pgadmin_platform_files) }}"
  vars:
    __pgadmin_platform_files:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: PGADMIN | Configure the official package repository
  ansible.builtin.include_tasks: "repository-{{ ansible_facts.os_family }}.yml"
  when: pgadmin_package_source == 'official'

- name: PGADMIN | Install application packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __pgadmin_packages[pgadmin_package_source] }}"
    state: present

- name: PGADMIN | Configure system settings
  ansible.builtin.import_tasks: configure.yml
